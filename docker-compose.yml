services:
  app:
    build: .
    container_name: zipurl-app
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env
    networks:
      - springboot-mongodb-redis-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=zipurl
    networks:
      - springboot-mongodb-redis-network

  redis:
    image: redis:latest
    container_name: redis
    command: ["redis-server", "--requirepass", "redis123"]
    ports:
      - "6379:6379"
    networks:
      - springboot-mongodb-redis-network

networks:
  springboot-mongodb-redis-network:
    driver: bridge
